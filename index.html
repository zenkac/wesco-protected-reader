<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#181C20"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; font-src 'self' blob:; media-src 'self' blob:; connect-src 'self' blob:; base-uri 'self'; form-action 'self'; object-src 'none'"><meta name="description" content="암호를 입력해 개인 원고를 열람하는 페이지."><title>개인 원고 열람</title><style>html{color-scheme:dark;background:#181C20;color:#E5E9EC;font-family:system-ui,sans-serif}body{margin:0}#root>.unlock-panel{min-height:100dvh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.unlock-card{width:min(400px,100%)}h1{font-size:30px;font-weight:500;margin:0 0 18px}p{line-height:1.8;color:#B3BBC2}label{display:block;margin:30px 0 10px;font-size:14px}input{width:100%;box-sizing:border-box;font:inherit;font-size:18px;border:1px solid #768591;background:#252D34;color:#E5E9EC;padding:14px;border-radius:0}button{width:100%;padding:14px;font:inherit;margin-top:14px;color:#181C20;background:#E5E9EC;border:0;cursor:pointer}button:disabled{opacity:.65}#message{min-height:50px;margin:16px 0 0;font-size:14px;color:#D4DCE2}.unlock-note{font-size:12px;color:#A3B0BB;margin-top:25px}a{color:inherit}:focus-visible{outline:2px solid #E5E9EC;outline-offset:4px}</style><script src="./unlock.js" defer></script></head><body><div id="root"><main class="unlock-panel"><section class="unlock-card"><h1>개인 원고 열람</h1><p>전달받은 암호를 입력하면<br>프롤로그와 장면들이 열립니다.</p><form id="unlock-form"><label for="password">열람 암호</label><input id="password" name="password" type="password" autocomplete="off" required autofocus spellcheck="false" aria-describedby="message"><button id="unlock-button" type="submit">원고 열기</button><p id="message" role="status" aria-live="polite"></p></form><p class="unlock-note">암호는 이 브라우저에서만 사용되며 서버로 전송되지 않습니다.</p></section></main></div><noscript>이 페이지를 열려면 JavaScript를 켜 주세요.</noscript></body></html>
